name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Test on Unix
        if: runner.os != 'Windows'
        run: sh scripts/test.sh
      - run: mvn --batch-mode package
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/check_repository.py
      - run: python scripts/check_artifacts.py

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn --batch-mode package
      - name: Publish tested JAR and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          test "$RELEASE_TAG" = "v$version"
          cp target/dupelens.jar "dupelens-$version.jar"
          cp target/dupelens-review.jar "dupelens-review-$version.jar"
          sha256sum "dupelens-$version.jar" "dupelens-review-$version.jar" > SHA256SUMS.txt
          python3 scripts/release_notes.py "$version" > release-notes.md
          gh release create "$RELEASE_TAG" "dupelens-$version.jar" "dupelens-review-$version.jar" SHA256SUMS.txt \
            --verify-tag --title "DupeLens $RELEASE_TAG" --notes-file release-notes.md
